<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 助手</title>
    <link rel="stylesheet" href="/assistant.css?v=20260820b">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="/" class="back-home">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/>
                    </svg>
                </a>
                <div class="sidebar-brand" id="sidebarBrand">AI 助手</div>
                <button class="new-session-btn" id="newSessionBtn" title="新建会话">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>
                <button class="new-session-btn" id="settingsBtn" title="设置">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
            </div>
            <div class="batch-toolbar" id="batchToolbar">
                <span class="batch-toolbar-title">会话记录</span>
                <button class="batch-edit-btn" id="batchEditBtn" title="批量管理">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                    </svg>
                    批量管理
                </button>
            </div>
            <div class="session-list" id="sessionList"></div>
            <div class="batch-action-bar" id="batchActionBar">
                <label class="batch-select-all">
                    <input type="checkbox" id="batchSelectAll">
                    <span>全选</span>
                </label>
                <span class="batch-count" id="batchCount">已选 0 项</span>
                <div class="batch-action-btns">
                    <button class="batch-action-btn batch-delete-btn" id="batchDeleteBtn">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        删除所选
                    </button>
                    <button class="batch-action-btn batch-cancel-btn" id="batchCancelBtn">取消</button>
                </div>
            </div>
            <div class="sidebar-footer">
                <button class="footer-btn" id="darkToggle" title="切换夜间模式">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- 设置面板 -->
        <div class="settings-popover" id="settingsPopover">
            <h4>主题颜色</h4>
            <div class="theme-grid">
                <button class="theme-dot active" data-theme="sage" title="鼠尾草绿"></button>
                <button class="theme-dot" data-theme="misty-blue" title="雾霾蓝"></button>
                <button class="theme-dot" data-theme="dusty-rose" title="灰玫瑰"></button>
                <button class="theme-dot" data-theme="mauve" title="藕荷紫"></button>
                <button class="theme-dot" data-theme="warm-gray" title="暖灰"></button>
                <button class="theme-dot" data-theme="terracotta" title="陶土"></button>
            </div>
            <div class="setting-row">
                <span class="setting-row-label">夜间模式</span>
                <button class="dark-toggle" id="darkToggle2" title="切换夜间模式">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 主聊天区 -->
        <main class="chat-main">
            <header class="chat-header">
                <div class="chat-title" id="chatTitle">AI 助手</div>
                <div class="chat-subtitle" id="chatSubtitle">智能对话 · 流式输出</div>
            </header>
            <div class="chat-area" id="chatArea">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon" id="emptyIcon">🤖</div>
                    <div class="empty-title">开始对话</div>
                    <div class="empty-desc" id="emptyDesc">输入你的问题，AI 助手会智能回答</div>
                </div>
            </div>
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="msgInput" placeholder="输入你的问题..." rows="1"></textarea>
                    <button id="sendBtn" class="send-btn" disabled>
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="/marked.min.js"></script>
    <script src="/assistant.js?v=20260820b"></script>
</body>
</html>
